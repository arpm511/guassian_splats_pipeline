[project]
name = "gaussian-splats-pipeline"
version = "2.0.0"
description = "Educational pipeline for creating 3D Gaussian Splats from video"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "arpm511", email = "arpm511@gmail.com"}
]

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "plyfile>=1.0.0",
    "matplotlib>=3.8.0",
    "pycolmap>=0.6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "pycolmap-cuda12>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
# UV-specific configuration
python-version = "3.11"

[tool.uv.pip]
# Prefer binary wheels
only-binary = ["pycolmap", "torch", "torchvision"]
